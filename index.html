<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>감자 마켓 - 이웃과 함께 나누는 따뜻한 중고거래</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥔</text></svg>">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ========================================================
       [화면 1] 1. 상단 GNB 헤더
       - 🥔 감자 로고
       - 검색창
       - [글쓰기], [로그인] 버튼
       ======================================================== -->
  <header class="gamza-header">
    <div class="gamza-container gamza-header-inner">
      <!-- 감자 로고 -->
      <a href="#" class="gamza-logo" id="logoBtn" aria-label="감자 마켓 홈으로 이동">
        <span class="gamza-logo-icon">🥔</span>
        <span class="gamza-logo-text">감자</span>
        <span class="gamza-logo-tag">마켓</span>
      </a>

      <!-- 통합 검색창 -->
      <div class="gamza-search-wrapper">
        <div class="gamza-search-box">
          <span class="gamza-search-icon" aria-hidden="true">🔍</span>
          <input 
            type="text" 
            id="searchInput" 
            class="gamza-search-input" 
            placeholder="동네 이름, 물품명 등을 검색해보세요" 
            autocomplete="off"
            aria-label="상품 및 동네 검색"
          />
          <button type="button" id="searchClearBtn" class="gamza-search-clear" aria-label="검색어 지우기">✕</button>
        </div>
      </div>

      <!-- 액션 버튼 ([글쓰기], [로그인] / [닉네임] & [로그아웃]) -->
      <div class="gamza-header-actions">
        <button type="button" class="gamza-btn-write" id="writeBtnHeader" aria-label="글쓰기">
          <span aria-hidden="true">✏️</span>
          <span class="btn-text">글쓰기</span>
        </button>
        <!-- 로그인 전 [로그인] 버튼 -->
        <button type="button" class="gamza-btn-login" id="loginBtnHeader">
          로그인
        </button>
        <!-- 로그인 후 [닉네임]과 [로그아웃] 버튼 (초기 숨김) -->
        <div class="gamza-user-menu" id="userMenuHeader" style="display: none;">
          <div class="gamza-user-badge" id="userNicknameHeader" title="로그인된 사용자">
            <span class="gamza-user-badge-icon">🥔</span>
            <span class="gamza-user-name" id="userNicknameText">닉네임</span>
          </div>
          <button type="button" class="gamza-btn-logout" id="logoutBtnHeader" aria-label="로그아웃">
            로그아웃
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- ========================================================
       [화면 1] 2. 필터 영역 & 상품 그리드
       ======================================================== -->
  <main class="gamza-container">
    <section class="gamza-filter-section" aria-label="상품 카테고리 및 필터">
      <!-- 카테고리 버튼: 전체, 디지털 기기, 가구/인테리어, 의류, 생활가전, 도서/티켓, 반려동물 용품, 기타 -->
      <div class="gamza-category-scroll" role="tablist">
        <button type="button" class="gamza-cat-chip is-active" data-category="전체" role="tab">전체</button>
        <button type="button" class="gamza-cat-chip" data-category="디지털 기기" role="tab">디지털 기기</button>
        <button type="button" class="gamza-cat-chip" data-category="가구/인테리어" role="tab">가구/인테리어</button>
        <button type="button" class="gamza-cat-chip" data-category="의류" role="tab">의류</button>
        <button type="button" class="gamza-cat-chip" data-category="생활가전" role="tab">생활가전</button>
        <button type="button" class="gamza-cat-chip" data-category="도서/티켓" role="tab">도서/티켓</button>
        <button type="button" class="gamza-cat-chip" data-category="반려동물 용품" role="tab">반려동물 용품</button>
        <button type="button" class="gamza-cat-chip" data-category="기타" role="tab">기타</button>
      </div>

      <!-- 서브 필터 바 (상품 개수, '거래가능만 보기' 스위치 토글) -->
      <div class="gamza-subfilter-bar">
        <div class="gamza-count-display" id="productCount">
          총 <strong>6</strong>개의 감자
        </div>

        <!-- '거래가능만 보기' 켜고 끄는 버튼 -->
        <label class="gamza-toggle-container" for="availableToggle">
          <span>거래가능만 보기</span>
          <div class="gamza-switch">
            <input type="checkbox" id="availableToggle" />
            <span class="gamza-slider"></span>
          </div>
        </label>
      </div>
    </section>

    <!-- 상품 카드 6개 그리드 -->
    <section class="gamza-grid-section" aria-label="중고거래 상품 목록">
      <div class="gamza-products-grid" id="productGrid">
        <!-- app.js에 의해 동적으로 렌더링됩니다 -->
      </div>
    </section>
  </main>

  <!-- ========================================================
       [화면 2] 상세 팝업 (모달)
       - 카드를 누르면 뜨는 팝업, 닫기 버튼으로 닫힘
       - 위쪽 절반을 상품 이미지가 채움
       - 그 아래 순서:
         1. 판매 상태
         2. 카테고리
         3. 상품명
         4. 판매 위치
         5. 업로드 시간
         6. 가격
         7. 상품 설명
       - 판매자 정보 (닉네임, 프로필 이미지, 판매 지역)
       - 맨 아래: [관심추가], [채팅 시작하기] 버튼 (자리만)
       ======================================================== -->
  <div id="detailModal" class="gamza-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
    <div class="gamza-detail-dialog">
      <!-- 닫기 버튼 -->
      <button type="button" class="gamza-modal-close-btn" id="detailCloseBtn" aria-label="상세보기 닫기">✕</button>

      <!-- 스크롤 가능 본문 -->
      <div class="gamza-modal-scroll">
        <!-- 위쪽 절반 상품 이미지 채우기 -->
        <div class="gamza-detail-hero">
          <img id="detailImage" src="" alt="상품 상세 이미지" />
        </div>

        <div class="gamza-detail-body">
          <!-- 1. 판매 상태 & 본인 글일 때 상태 변경 버튼 -->
          <div class="gamza-detail-status-row">
            <span id="detailBadge" class="gamza-badge status-selling">판매중</span>
            
            <!-- 작성자 전용 판매 상태 변경 버튼 그룹 -->
            <div class="gamza-owner-status-box" id="ownerStatusBox" style="display: none;">
              <span class="gamza-status-group-label">상태 변경:</span>
              <div class="gamza-status-btn-group" role="group" aria-label="판매 상태 변경">
                <button type="button" class="gamza-status-btn" data-status="판매중">🟢 판매중</button>
                <button type="button" class="gamza-status-btn" data-status="예약중">🟠 예약중</button>
                <button type="button" class="gamza-status-btn" data-status="거래완료">⚪ 거래완료</button>
              </div>
            </div>
          </div>

          <!-- 2. 카테고리 -->
          <div class="gamza-detail-category" id="detailCategory">카테고리</div>

          <!-- 3. 상품명 -->
          <h2 class="gamza-detail-title" id="detailTitle">상품명</h2>

          <!-- 4. 판매 위치 & 5. 업로드 시간 -->
          <div class="gamza-detail-loc-time">
            <span class="gamza-loc-tag">📍 <span id="detailLocation">동네</span></span>
            <span class="gamza-time-tag" id="detailTime">방금 전</span>
          </div>

          <!-- 6. 가격 -->
          <div class="gamza-detail-price" id="detailPrice">0원</div>

          <!-- 7. 상품 설명 -->
          <div class="gamza-detail-desc" id="detailDesc">상품 설명이 들어갑니다.</div>

          <!-- 판매자 정보 (닉네임, 프로필 이미지, 판매 지역) -->
          <div class="gamza-seller-box">
            <div class="gamza-seller-profile">
              <img id="sellerAvatar" class="gamza-seller-avatar" src="" alt="판매자 프로필" />
              <div class="gamza-seller-info">
                <span class="gamza-seller-name" id="sellerName">판매자</span>
                <span class="gamza-seller-region" id="sellerRegion">판매 지역</span>
              </div>
            </div>
            <div class="gamza-seller-manner">
              <span class="gamza-manner-score" id="sellerTemp">36.5℃</span>
              <div class="gamza-manner-label">🥔 매너온도</div>
            </div>
          </div>
        </div>
      </div>

      <!-- 맨 아래 액션 바 1: 일반 구매자용 [관심추가], [채팅 시작하기] 버튼 -->
      <div class="gamza-detail-actions" id="detailBuyerActions">
        <button type="button" class="gamza-btn-like" id="detailLikeBtn" aria-label="관심추가">
          <span>🤍</span>
          <span>관심추가</span>
        </button>
        <button type="button" class="gamza-btn-chat" id="detailChatBtn" aria-label="채팅 시작하기">
          <span>💬</span>
          <span>채팅 시작하기</span>
        </button>
      </div>

      <!-- 맨 아래 액션 바 2: 작성자 전용 [수정], [삭제] 버튼 -->
      <div class="gamza-detail-actions gamza-detail-owner-actions" id="detailOwnerActions" style="display: none;">
        <button type="button" class="gamza-btn-edit" id="detailEditBtn" aria-label="게시글 수정">
          <span>✏️</span>
          <span>수정하기</span>
        </button>
        <button type="button" class="gamza-btn-delete" id="detailDeleteBtn" aria-label="게시글 삭제">
          <span>🗑️</span>
          <span>삭제하기</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================
       [화면 3] 글쓰기 팝업 (모달)
       - 입력칸: 상품 이미지, 상품명, 카테고리, 가격, 자세한 설명, 거래 동네, 판매상태
       - 판매상태: 판매중 / 예약중 / 거래완료 선택
       - 맨 아래 [작성완료] 버튼
       ======================================================== -->
  <div id="writeModal" class="gamza-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="writeModalHeading">
    <div class="gamza-write-dialog">
      <!-- 헤더 -->
      <div class="gamza-write-header">
        <h2 class="gamza-write-title" id="writeModalHeading">
          <span>🥔</span>
          <span>내 물건 팔기</span>
        </h2>
        <button type="button" class="gamza-modal-close-btn" id="writeCloseBtn" style="position: static;" aria-label="글쓰기 닫기">✕</button>
      </div>

      <!-- 글쓰기 폼 -->
      <div class="gamza-modal-scroll">
        <form id="writeForm" class="gamza-form">
          
          <!-- 1. 상품 이미지 입력 -->
          <div class="gamza-field">
            <label class="gamza-label">상품 이미지</label>
            <div class="gamza-image-inputs">
              <div class="gamza-preview-container">
                <div class="gamza-thumb-preview">
                  <img id="writeImagePreview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 100 100'><rect width='100%' height='100%' fill='%23F4EBE2'/><text x='50' y='55' font-size='32' text-anchor='middle'>🥔</text></svg>" alt="미리보기" />
                </div>
                <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
                  <input type="text" id="writeImageUrl" class="gamza-input" placeholder="이미지 URL 직접 입력 (https://...)" />
                  <input type="file" id="writeImageFile" class="gamza-input" accept="image/*" style="font-size: 0.85rem; padding: 8px;" />
                </div>
              </div>
              <!-- 빠른 샘플 이미지 선택 -->
              <div class="gamza-image-quick-buttons">
                <button type="button" class="gamza-quick-img-btn" data-url="https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=800&auto=format&fit=crop&q=80">📱 태블릿 예시</button>
                <button type="button" class="gamza-quick-img-btn" data-url="https://images.unsplash.com/photo-1532372320572-cda25653a26d?w=800&auto=format&fit=crop&q=80">🪑 가구 예시</button>
                <button type="button" class="gamza-quick-img-btn" data-url="https://images.unsplash.com/photo-1578587018452-892bacefd3f2?w=800&auto=format&fit=crop&q=80">🧥 의류 예시</button>
                <button type="button" class="gamza-quick-img-btn" data-url="https://images.unsplash.com/photo-1517668808822-9ebb02ae2a0e?w=800&auto=format&fit=crop&q=80">☕ 가전 예시</button>
                <button type="button" class="gamza-quick-img-btn" data-url="https://images.unsplash.com/photo-1541599540903-216a46ca1dc0?w=800&auto=format&fit=crop&q=80">🐶 반려동물 예시</button>
              </div>
            </div>
          </div>

          <!-- 2. 상품명 -->
          <div class="gamza-field">
            <label class="gamza-label" for="writeTitle">상품명 <span class="required">*</span></label>
            <input type="text" id="writeTitle" class="gamza-input" placeholder="상품명을 입력해주세요" required />
          </div>

          <!-- 3. 카테고리 -->
          <div class="gamza-field">
            <label class="gamza-label" for="writeCategory">카테고리 <span class="required">*</span></label>
            <select id="writeCategory" class="gamza-select" required>
              <option value="" disabled selected>카테고리를 선택해주세요</option>
              <option value="디지털 기기">디지털 기기</option>
              <option value="가구/인테리어">가구/인테리어</option>
              <option value="의류">의류</option>
              <option value="생활가전">생활가전</option>
              <option value="도서/티켓">도서/티켓</option>
              <option value="반려동물 용품">반려동물 용품</option>
              <option value="기타">기타</option>
            </select>
          </div>

          <!-- 4. 가격 -->
          <div class="gamza-field">
            <label class="gamza-label" for="writePrice">가격 (원) <span class="required">*</span></label>
            <input type="number" id="writePrice" class="gamza-input" placeholder="가격을 입력해주세요 (0원 입력 시 무료나눔)" min="0" required />
          </div>

          <!-- 5. 거래 동네 -->
          <div class="gamza-field">
            <label class="gamza-label" for="writeLocation">거래 동네 <span class="required">*</span></label>
            <input type="text" id="writeLocation" class="gamza-input" placeholder="거래 희망 동네 (예: 역삼동, 서초동)" required />
          </div>

          <!-- 6. 판매상태 (판매중 / 예약중 / 거래완료) -->
          <div class="gamza-field">
            <label class="gamza-label">판매 상태 <span class="required">*</span></label>
            <div class="gamza-status-group">
              <label class="gamza-status-radio-label selected-selling">
                <input type="radio" name="writeStatus" value="판매중" checked />
                <span>🟢 판매중</span>
              </label>
              <label class="gamza-status-radio-label">
                <input type="radio" name="writeStatus" value="예약중" />
                <span>🟠 예약중</span>
              </label>
              <label class="gamza-status-radio-label">
                <input type="radio" name="writeStatus" value="거래완료" />
                <span>⚪ 거래완료</span>
              </label>
            </div>
          </div>

          <!-- 7. 자세한 설명 -->
          <div class="gamza-field">
            <label class="gamza-label" for="writeDescription">자세한 설명</label>
            <textarea id="writeDescription" class="gamza-textarea" maxlength="500" placeholder="구매 시기, 사용감, 하자 여부 등 상품 상태를 솔직하게 작성해주세요. (최대 500자)"></textarea>
            <div id="writeCharCounter" style="text-align: right; font-size: 0.8rem; color: #8C7A6B; margin-top: 4px;">0 / 500자</div>
          </div>

        </form>
      </div>

      <!-- 하단 [작성완료] 버튼 -->
      <div class="gamza-write-footer">
        <button type="button" class="gamza-btn-cancel" id="writeCancelBtn">취소</button>
        <button type="submit" form="writeForm" class="gamza-btn-submit" id="writeSubmitBtn">
          🥔 작성완료
        </button>
      </div>
    </div>
  </div>

  <!-- ========================================================
       [로그인 & 회원가입 팝업 (모달)]
       - 이메일, 비밀번호로 회원가입 및 로그인
       - 회원가입 시 닉네임 필수 입력
       - 수파베이스 Auth 연동
       ======================================================== -->
  <div id="authModal" class="gamza-modal-overlay" role="dialog" aria-modal="true" aria-labelledby="authModalHeading">
    <div class="gamza-auth-dialog">
      <!-- 닫기 버튼 -->
      <button type="button" class="gamza-modal-close-btn" id="authCloseBtn" aria-label="로그인 창 닫기">✕</button>

      <!-- 모달 상단 헤더 & 모드 전환 탭 -->
      <div class="gamza-auth-header">
        <div class="gamza-auth-brand">
          <span class="gamza-auth-icon">🥔</span>
          <h2 class="gamza-auth-title" id="authModalHeading">감자 마켓 로그인</h2>
          <p class="gamza-auth-desc" id="authModalDesc">우리 동네 이웃과 따뜻한 중고거래를 시작해보세요!</p>
        </div>
        
        <div class="gamza-auth-tabs" role="tablist">
          <button type="button" class="gamza-auth-tab is-active" id="tabLoginBtn" role="tab" aria-selected="true">로그인</button>
          <button type="button" class="gamza-auth-tab" id="tabSignupBtn" role="tab" aria-selected="false">회원가입</button>
        </div>
      </div>

      <!-- 인증 폼 -->
      <form id="authForm" class="gamza-auth-form" novalidate>
        <!-- 닉네임 (회원가입 모드일 때만 표시) -->
        <div class="gamza-field" id="authNicknameField" style="display: none;">
          <label class="gamza-label" for="authNickname">
            감자 닉네임 <span class="required">*</span>
          </label>
          <input 
            type="text" 
            id="authNickname" 
            class="gamza-input" 
            placeholder="동네에서 불릴 닉네임을 입력해주세요 (2~12자)" 
            maxlength="12"
            autocomplete="nickname"
          />
          <span class="gamza-field-help">다른 사용자에게 보여질 닉네임입니다.</span>
        </div>

        <!-- 이메일 -->
        <div class="gamza-field">
          <label class="gamza-label" for="authEmail">
            이메일 <span class="required">*</span>
          </label>
          <input 
            type="email" 
            id="authEmail" 
            class="gamza-input" 
            placeholder="example@gamza.com" 
            required 
            autocomplete="email"
          />
        </div>

        <!-- 비밀번호 -->
        <div class="gamza-field">
          <label class="gamza-label" for="authPassword">
            비밀번호 <span class="required">*</span>
          </label>
          <input 
            type="password" 
            id="authPassword" 
            class="gamza-input" 
            placeholder="비밀번호 (6자 이상)" 
            minlength="6" 
            required 
            autocomplete="current-password"
          />
        </div>

        <!-- 에러/알림 메시지 -->
        <div id="authErrorMsg" class="gamza-auth-error" style="display: none;"></div>

        <!-- 제출 버튼 -->
        <button type="submit" class="gamza-btn-auth-submit" id="authSubmitBtn">
          🥔 로그인
        </button>

        <!-- 하단 모드 전환 링크 -->
        <div class="gamza-auth-footer-toggle">
          <span id="authToggleText">아직 감자 마켓 계정이 없으신가요?</span>
          <button type="button" id="authToggleLink" class="gamza-auth-link">회원가입하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 푸터 -->
  <footer class="gamza-footer">
    <div class="gamza-container">
      <div class="gamza-footer-logo">🥔 감자 마켓</div>
      <p>우리 동네 따뜻한 중고거래 플랫폼 (포슬포슬한 이웃 거래)</p>
      <p style="margin-top: 8px; font-size: 0.8rem; opacity: 0.7;">© 2026 Gamza Market. All rights reserved.</p>
    </div>
  </footer>

  <!-- 알림 토스트 컨테이너 -->
  <div id="gamzaToastContainer" class="gamza-toast-container"></div>

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- 통합 스크립트 로드 -->
  <script src="app.js"></script>
</body>
</html>
